[project]
name = "research-radar"
version = "0.1.0"
description = "Daily research paper digest across 4 directions"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "openai>=1.40.0",
    "pyzotero>=1.5.18",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
# Corpus analytics module (scripts/build_analytics.py, ADR-0018).
# Offline, manual-run only; NOT needed by the daily pipeline or CI cron.
# Install with:  pip install -e ".[analytics]"
analytics = [
    "matplotlib>=3.10",
]

[tool.setuptools]
packages = ["fetchers", "pipeline", "render"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=7.0",
]
