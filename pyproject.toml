[project]
name = "research-radar"
version = "0.1.0"
description = "Daily research paper digest across 4 directions"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "openai>=1.40.0",
    "pyzotero>=1.5.18",
    "PyYAML>=6.0.1",
]

[tool.setuptools]
packages = ["fetchers", "pipeline", "render"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=7.0",
]
