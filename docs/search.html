<!doctype html><html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Radar — 搜索</title>
<link rel="stylesheet" href="radar-ui.css"><script src="radar-ui.js" defer></script><script src="radar-card.js" defer></script><script src="radar-search.js" defer></script></head><body>
<nav class="site-nav" aria-label="主导航"><a class="site-nav__brand" href="index.html">Research Radar</a><div class="site-nav__links"><a href="index.html" class="site-nav__link">今日</a><a href="queue.html" class="site-nav__link">队列</a><a href="search.html" aria-current="page" class="site-nav__link is-active">搜索</a><a href="library.html" class="site-nav__link">资料库</a><a href="archive.html" class="site-nav__link">归档</a><details class="site-nav__admin"><summary>系统</summary><div class="site-nav__menu"><a href="status.html">运行状态</a><a href="weekly/index.html">周报</a></div></details></div></nav>
<main id="main-content" class="container">
<div class="eyebrow">Metadata-first corpus search</div>
<h1>搜索 10 万篇论文</h1>
<p class="subtitle">默认搜索标题、作者、期刊、标签与首要术语；完整术语、摘要和中文总结按年份深搜。</p>
<label class="search-box">
  <span>关键词</span>
  <input id="search-query" type="search" autocomplete="off"
         placeholder="输入标题、作者、标签或术语…" autofocus>
</label>
<div class="search-toolbar" aria-label="搜索筛选">
  <label>方向<select id="search-direction"><option value="">全部方向</option><option value="ai_bioprinting">AI for Bioprinting</option><option value="hip_implant">Hip Implant &amp; Femoral Stem</option><option value="fea_surrogate">FEA &amp; Surrogate Modelling</option><option value="rl_world_model">RL &amp; World Models</option><option value="am_biomedical">AM Biomedical Materials</option></select></label>
  <label>等级<select id="search-priority"><option value="">全部等级</option><option>High</option><option>Medium</option><option>Low</option><option>Exclude</option></select></label>
  <label>相关性<select id="search-relevance"><option value="">全部</option><option>Direct</option><option>Transferable</option><option>Peripheral</option></select></label>
  <label>发表年份<select id="search-year"><option value="">全部年份</option></select></label>
</div>
<div class="deep-search-control">
  <label><input id="search-deep-toggle" type="checkbox"> 搜索摘要、中文总结与相关性说明</label>
  <label>深搜年份<select id="search-deep-year"><option value="">请选择年份</option></select></label>
</div>
<div id="search-status" class="search-status" aria-live="polite">正在载入轻量索引…</div>
<div id="search-results" class="search-results"></div>
<button type="button" id="search-more" class="rui-btn search-more" hidden>加载更多结果</button>
</main>
</body></html>
