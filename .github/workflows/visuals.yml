name: enrich-research-radar-visuals

on:
  workflow_run:
    workflows:
      - daily-research-radar
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Priority queue to backfill
        required: true
        type: choice
        options:
          - High
          - Medium
          - High+Medium
        default: High
      limit:
        description: Papers to check in this checkpointed batch (1-500)
        required: true
        type: number
        default: 100
      batches:
        description: Checkpoint batches to run sequentially (1-3)
        required: true
        type: number
        default: 1
      identity:
        description: "Optional exact doi: or arxiv: identity to refresh"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: research-radar-writer
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out latest production data
        uses: actions/checkout@v4
        with:
          # This workflow can wait behind another writer. Always enrich the
          # latest main branch rather than the event's queued commit.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      - name: Discover open-license card visuals
        env:
          PUBMED_EMAIL: ${{ vars.PUBMED_EMAIL }}
          VISUAL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || 40 }}
          VISUAL_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'High+Medium' }}
          VISUAL_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.batches || 1 }}
          VISUAL_IDENTITY: ${{ github.event_name == 'workflow_dispatch' && inputs.identity || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VISUAL_LIMIT" =~ ^[0-9]+$ ]] ||
             [ "$VISUAL_LIMIT" -lt 1 ] || [ "$VISUAL_LIMIT" -gt 500 ]; then
            echo "::error::limit must be an integer from 1 to 500"
            exit 2
          fi
          if ! [[ "$VISUAL_BATCHES" =~ ^[0-9]+$ ]] ||
             [ "$VISUAL_BATCHES" -lt 1 ] || [ "$VISUAL_BATCHES" -gt 3 ]; then
            echo "::error::batches must be an integer from 1 to 3"
            exit 2
          fi

          case "$VISUAL_SCOPE" in
            High) priorities=(High) ;;
            Medium) priorities=(Medium) ;;
            High+Medium) priorities=(High Medium) ;;
            *)
              echo "::error::unsupported visual scope: $VISUAL_SCOPE"
              exit 2
              ;;
          esac

          identity_args=()
          if [ -n "$VISUAL_IDENTITY" ]; then
            if ! [[ "$VISUAL_IDENTITY" =~ ^(doi|arxiv):[^[:space:]]+$ ]]; then
              echo "::error::identity must be an exact doi: or arxiv: key without whitespace"
              exit 2
            fi
            identity_args=(--identity "$VISUAL_IDENTITY")
          fi

          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"

          for ((batch = 1; batch <= VISUAL_BATCHES; batch++)); do
            echo "::group::Visual checkpoint $batch/$VISUAL_BATCHES"
            python -m scripts.enrich_visuals \
              --limit "$VISUAL_LIMIT" \
              --priorities "${priorities[@]}" \
              "${identity_args[@]}"

            git add data/visuals/index.json
            if git diff --staged --quiet; then
              echo "No further eligible records; stopping early."
              echo "::endgroup::"
              break
            fi
            git commit -m "visuals: enrich open-license paper figures"
            git push
            echo "::endgroup::"
          done
