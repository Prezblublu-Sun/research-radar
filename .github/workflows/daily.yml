name: daily-research-radar

on:
  schedule:
    # Off the top of the hour: GitHub queues :00 schedules for hours during
    # busy periods (September runs started 07:19-08:14 UTC for a 03:00 cron).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: research-radar-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued writer must start after the previous writer's commit.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      - name: Fetch and process papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
          PUBMED_EMAIL: ${{ vars.PUBMED_EMAIL }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOT_COL_BIOPRINTING: ${{ vars.ZOT_COL_BIOPRINTING }}
          ZOT_COL_HIP: ${{ vars.ZOT_COL_HIP }}
          ZOT_COL_FEA: ${{ vars.ZOT_COL_FEA }}
          ZOT_COL_AM: ${{ vars.ZOT_COL_AM }}
          SCORER_PROMPT_FILE: scorer_v3.txt
        run: python -m pipeline.run_daily

      - name: SCOPE.md boundary audit
        id: scope_audit
        continue-on-error: true
        run: |
          python -m pipeline.scope_audit \
            --output "data/audit/scope_audit_$(date -u +%Y-%m-%d).json"

      - name: Export candidates for lit-system
        run: python -m pipeline.export_candidates

      - name: Commit results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add data/ docs/ CHANGELOG.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "daily: $(date -u +%Y-%m-%d)"
          bash scripts/git_push_retry.sh main 5

      - name: Daily run health gate
        # Blocks only when the day's data is missing or largely unscored;
        # single-source outages and truncation surface as warnings so the
        # Pages deploy (gated on this workflow's conclusion) still runs.
        run: python -m pipeline.health_gate

      - name: Fail if scope_audit reported errors
        if: steps.scope_audit.outcome == 'failure'
        run: |
          echo "::error::scope_audit detected SCOPE.md boundary violations. See data/audit/scope_audit_$(date -u +%Y-%m-%d).json in the latest commit."
          exit 1

      - name: Upload diagnostic artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-diagnostics-${{ github.run_id }}
          path: |
            data/manifests/
            data/audit/
          retention-days: 14
